<svg xmlns="http://www.w3.org/2000/svg" width="960" height="230" viewBox="0 0 960 230" role="img" aria-label="Animated developer terminal: shini builds web, cloud, and AI projects"><title>Animated developer terminal: shini builds web, cloud, and AI projects</title><rect width="960" height="230" rx="18" fill="#0d141b"/><g font-family="Arial, Helvetica, sans-serif"><path d="M 0 45 H 960" stroke="#253342"/><circle cx="25" cy="23" r="5" fill="#fb7185"/><circle cx="45" cy="23" r="5" fill="#fbbf24"/><circle cx="65" cy="23" r="5" fill="#a3e635"/><text x="90" y="28" font-size="13" fill="#94a3b8" >shini@github ~ / workspace</text><text x="932" y="28" font-size="11" fill="#a3e635" text-anchor="end">● BUILD MODE</text><text x="28" y="83" font-size="19" fill="#22d3ee" >$ shini --explore</text><g opacity="1"><animate attributeName="opacity" values="0.35;1;1;0.35" keyTimes="0;0.2;0.8;1" dur="5s" begin="0.0s" repeatCount="indefinite"/><text x="28" y="116" font-size="16" fill="#e2e8f0" >01  WEB      React / Next.js / .NET</text></g><g opacity="1"><animate attributeName="opacity" values="0.35;1;1;0.35" keyTimes="0;0.2;0.8;1" dur="5s" begin="0.5s" repeatCount="indefinite"/><text x="28" y="145" font-size="16" fill="#e2e8f0" >02  SYSTEMS  IoT / dashboards / cloud</text></g><g opacity="1"><animate attributeName="opacity" values="0.35;1;1;0.35" keyTimes="0;0.2;0.8;1" dur="5s" begin="1.0s" repeatCount="indefinite"/><text x="28" y="174" font-size="16" fill="#e2e8f0" >03  TOOLS    Python / AI / automation</text></g><text x="28" y="212" font-size="14" fill="#94a3b8" >$ code · learn · build · improve</text><rect x="287" y="198" width="9" height="17" fill="#a3e635"><animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/></rect><path d="M 680 103 H 730 V 144 H 798 V 113 H 911 M 680 174 H 749 V 196 H 911" fill="none" stroke="#253342" stroke-width="2"/><circle r="4" fill="#22d3ee"><animateMotion dur="4s" repeatCount="indefinite" path="M 680 103 H 730 V 144 H 798 V 113